name: Build UFI103S kernel with IMS crypto (VoLTE fix v3)

on:
  workflow_dispatch:
  push:
    branches:
      - wip/msm8916/7.0

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this fork's kernel source
        uses: actions/checkout@v4
        with:
          ref: wip/msm8916/7.0
          fetch-depth: 1

      - name: Install cross toolchain
        run: |
          set -x
          for i in 1 2 3; do
            echo "=== apt-get update attempt $i ==="
            if sudo apt-get update; then break; fi
            sleep 15
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version

      - name: Enable MD5 and NULL crypto for 3GPP IMS IPSec
        run: |
          set -x
          F=arch/arm64/configs/ufi103s_v03_defconfig
          echo '--- before ---'
          grep -E 'CONFIG_CRYPTO_(MD5|NULL)' "$F"
          sed -i 's/^# CONFIG_CRYPTO_MD5 is not set$/CONFIG_CRYPTO_MD5=y/' "$F"
          sed -i 's/^# CONFIG_CRYPTO_NULL is not set$/CONFIG_CRYPTO_NULL=y/' "$F"
          echo '--- after ---'
          grep -E 'CONFIG_CRYPTO_(MD5|NULL)' "$F"
          grep -q '^CONFIG_CRYPTO_MD5=y$' "$F"
          grep -q '^CONFIG_CRYPTO_NULL=y$' "$F"
          # Remove .git so scripts/setlocalversion cannot detect a dirty tree
          # and will NOT append the '+' suffix. Version stays 7.0.0-spunckore.
          rm -rf .git
          echo 'git removed, no dirty suffix will be added'

      - name: Build kernel and modules
        run: |
          set -x
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ufi103s_v03_defconfig
          echo '--- kernel release (must be 7.0.0-spunckore, no +) ---'
          cat include/config/kernel.release 2>/dev/null || make ARCH=arm64 kernelrelease
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=$PWD/modstaging modules_install
          echo '--- final release ---'
          cat include/config/kernel.release

      - name: Collect artifacts
        run: |
          set -x
          mkdir -p artifacts
          cp arch/arm64/boot/Image.gz artifacts/vmlinuz-7.0.0-spunckore
          cp include/config/kernel.release artifacts/kernel.release
          cp System.map artifacts/
          cp .config artifacts/config-7.0.0-spunckore
          gzip -c .config > artifacts/config-7.0.0-spunckore.gz
          if [ -d modstaging/lib/modules ]; then
            mkdir -p artifacts/modules
            cp -a modstaging/lib/modules/* artifacts/modules/
          fi
          echo '--- artifacts ---'
          ls -lh artifacts/
          echo -n 'module count: '
          find artifacts/modules -name '*.ko*' 2>/dev/null | wc -l

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-volte-v3
          path: artifacts/
          if-no-files-found: error
